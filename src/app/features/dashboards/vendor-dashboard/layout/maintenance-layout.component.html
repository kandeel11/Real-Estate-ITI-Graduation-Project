<div class="shell" [class.collapsed]="sidebarCollapsed()" [class.mob-open]="mobileSidebarOpen()">

  @if (mobileSidebarOpen()) {
    <div class="mob-overlay" (click)="closeMobileSidebar()"></div>
  }

  <app-maintenance-sidebar [collapsed]="sidebarCollapsed()"
      [companyName]="auth.user()?.fullName ?? 'Maintenance Co.'" />

  <div class="main">
    <header class="topbar">
      <div class="topbar__left">
        <button class="menu-btn" (click)="toggleSidebar()" title="Toggle">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search tickets, customers..." />
      </div>

      <div class="topbar__right">
        <button class="icon-btn" title="Notifications">
          <i class="fa-regular fa-bell"></i>
          <span class="dot"></span>
        </button>
        <button class="icon-btn" title="Messages">
          <i class="fa-regular fa-envelope"></i>
        </button>
        <div class="profile">
          <div class="avatar">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="profile-info">
            <strong>{{ auth.user()?.fullName || 'User' }}</strong>
            <span>Maintenance Company</span>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
