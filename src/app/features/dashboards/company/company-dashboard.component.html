<div class="dashboard-layout" [dir]="lang.isRtl() ? 'rtl' : 'ltr'">
    <!-- ── SIDEBAR (desktop) ───────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-building brand-icon"></i>
            <span class="brand-name">{{ 'COMPANY_NAV.BRAND' | translate }}</span>
            <button class="lang-toggle" (click)="lang.toggle()"
                    [title]="lang.isRtl() ? 'Switch to English' : 'التبديل إلى العربية'">
                <i class="fa-solid fa-globe"></i>
                <span>{{ lang.isRtl() ? 'EN' : 'ع' }}</span>
            </button>
        </div>

        <nav class="sidebar-nav" aria-label="Dashboard navigation">
            @for (item of navItems; track item.route) {
            <a class="nav-item" [routerLink]="item.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: !!item.exact }" [attr.aria-label]="item.label | translate">
                <i [class]="item.icon"></i>
                <span class="nav-label">{{ item.label | translate }}</span>
            </a>
            }
        </nav>

        <div class="sidebar-footer">
            <div class="user-avatar-sm" aria-hidden="true">{{ userInitials }}</div>
            <div class="user-info">
                <span class="user-name">{{ userName }}</span>
                <span class="user-role">{{ 'COMPANY_NAV.ROLE' | translate }}</span>
            </div>
            <button class="btn-logout" (click)="logout()" [title]="'COMPANY_NAV.LOGOUT' | translate" aria-label="Sign out">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </aside>

    <!-- ── MAIN CONTENT ────────────────────────────── -->
    <main class="main-content">
        <div class="route-container p-4" [@routeAnimations]="prepareRoute(outlet)">
            <router-outlet #outlet="outlet" />
        </div>
    </main>
</div>

<!-- ── BOTTOM TAB BAR (mobile) ─────────────────── -->
<nav class="bottom-tab-bar" aria-label="Mobile navigation">
    @for (item of navItems; track item.route) {
    <a class="tab-item" [routerLink]="item.route" routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: !!item.exact }">
        <span class="tab-icon-wrap">
            <i [class]="item.icon"></i>
        </span>
        <span class="tab-label">{{ item.label | translate }}</span>
    </a>
    }
    <button class="tab-item tab-logout" (click)="logout()" aria-label="Sign out">
        <span class="tab-icon-wrap">
            <i class="fa-solid fa-right-from-bracket"></i>
        </span>
        <span class="tab-label">{{ 'COMPANY_NAV.LOGOUT' | translate }}</span>
    </button>
</nav>
