<aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="sidebar__brand">
        <div class="brand-logo">
            <i class="fa-solid fa-building-shield"></i>
        </div>
        @if (!collapsed()) {
        <div class="brand-text">
            <h2>Estatein</h2>
            <span>Admin Access</span>
        </div>
        }
    </div>

    <nav class="sidebar__nav">
        @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" [title]="item.label">
            <i [class]="item.icon"></i>
            @if (!collapsed()) {
            <span class="nav-label">{{ item.label }}</span>
            @if (item.badge) {
            <span class="nav-badge">{{ item.badge }}</span>
            }
            }
        </a>
        }
    </nav>

    <div class="sidebar__footer">
        <button class="ai-insights" routerLink="/dashboard/admin/ai" title="AI Insights" routerLinkActive="active">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            @if (!collapsed()) { <span>AI Insights</span> }
        </button>
        <a class="nav-item" routerLink="/support">
            <i class="fa-regular fa-circle-question"></i>
            @if (!collapsed()) { <span class="nav-label">Support</span> }
        </a>
        <a class="nav-item logout" routerLink="/login" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            @if (!collapsed()) { <span class="nav-label">Log Out</span> }
        </a>
    </div>
</aside>
