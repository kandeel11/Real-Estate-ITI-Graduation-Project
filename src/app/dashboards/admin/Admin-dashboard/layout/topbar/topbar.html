<header class="topbar">
    <div class="topbar__left">
        <button class="icon-btn menu" (click)="menuToggle.emit()" title="Toggle menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" [placeholder]="'ADMIN_TOPBAR.SEARCH_PLACEHOLDER' | translate" />
        </div>
    </div>

    <div class="topbar__right">
        <button class="icon-btn lang-btn" (click)="lang.toggle()" [title]="lang.isRtl() ? 'Switch to English' : 'التبديل إلى العربية'">
            <i class="fa-solid fa-globe"></i>
            <span>{{ lang.isRtl() ? 'EN' : 'ع' }}</span>
        </button>
        <button class="icon-btn" title="Notifications">
            <i class="fa-regular fa-bell"></i>
            <span class="dot"></span>
        </button>
        <button class="icon-btn" title="Messages">
            <i class="fa-regular fa-envelope"></i>
        </button>
        <div class="profile">
            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="profile-info">
                <strong>{{ 'ADMIN_TOPBAR.ADMIN' | translate }}</strong>
                <span>{{ 'ADMIN_TOPBAR.SUPER_ADMIN' | translate }}</span>
            </div>
        </div>
    </div>
</header>
