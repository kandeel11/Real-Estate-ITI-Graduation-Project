<div class="shell" [class.collapsed]="sidebarCollapsed()">
    <app-maintenance-sidebar [collapsed]="sidebarCollapsed()" />

    <div class="main">
        <header class="topbar">
            <div class="topbar__left">
                <button class="menu-btn" (click)="toggleSidebar()" title="Toggle">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search tickets, customers..." />
                </div>
            </div>
            <div class="topbar__right">
                <button class="icon-btn" title="Notifications">
                    <i class="fa-regular fa-bell"></i>
                    <span class="dot"></span>
                </button>
                <button class="icon-btn" title="Messages">
                    <i class="fa-regular fa-envelope"></i>
                </button>
                <div class="avatar">
                    <img src="https://i.pravatar.cc/100?img=33" alt="User" />
                </div>
            </div>
        </header>

        <main class="content">
            <router-outlet />
        </main>
    </div>
</div>
